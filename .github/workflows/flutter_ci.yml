name: Direct Logic Test

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  push:
    branches:
      - appium-devops

permissions:
  contents: write
  pull-requests: write

jobs:
  test_logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # SIMULATED TEST STEP
      # Change 'failure' to 'success' below to test the PR side of things
      - name: Run Simulated Test
        id: test_step
        run: |
          echo "Simulating test execution..."
          RESULT="failure" 
          echo "outcome=$RESULT" >> $GITHUB_OUTPUT

      # EXECUTE TRELLO LOGIC
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
        run: |
          echo "Test failed! Sending to Trello..."
          curl --request POST \
            --url "https://api.trello.com/1/cards" \
            --query "key=$TRELLO_KEY" \
            --query "token=$TRELLO_TOKEN" \
            --data-urlencode "idList=$TRELLO_LIST_ID" \
            --data-urlencode "name= TEST FAILURE: ${{ github.ref_name }}" \
            --data-urlencode "desc=This is a direct logic test run for the appium-devops branch."

      # EXECUTE PR LOGIC
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Test passed! Simulating PR..."
          gh pr create \
            --title "Test PR: ${{ github.ref_name }}" \
            --body "This is a simulated PR for testing purposes." \
            --base main \
            --head ${{ github.ref_name }}
