name: QA Pipeline (Self-Hosted Appium + Trello)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 45

    steps:

      # ─────────────────────────────────────────────
      # 1. Checkout Repository
      # ─────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Verify Installed Dependencies
      # ─────────────────────────────────────────────
      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Verify Node.js
        run: node -v

      - name: Verify Appium
        run: appium -v

      # ─────────────────────────────────────────────
      # 3. Setup Flutter
      # ─────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ─────────────────────────────────────────────
      # 4. Install Flutter Dependencies
      # ─────────────────────────────────────────────
      - name: Install Flutter Dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────
      # 5. Build APK
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        run: flutter build apk --debug

      # ─────────────────────────────────────────────
      # 6. Verify Emulator Is Running
      # ─────────────────────────────────────────────
      - name: Verify Emulator
        run: |
          echo "Checking connected Android devices..."
          adb devices

          echo "Waiting for emulator..."
          adb wait-for-device

          echo "Waiting for Android boot completion..."

          until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
            echo "Android still booting..."
            sleep 5
          done

          echo "Android emulator fully booted"

      # ─────────────────────────────────────────────
      # 7. Verify Appium Server
      # ─────────────────────────────────────────────
      - name: Verify Appium Server
        run: |
          echo "Checking Appium server..."

          curl --fail http://127.0.0.1:4723/wd/hub/status

      # ─────────────────────────────────────────────
      # 8. Install APK Into Emulator
      # ─────────────────────────────────────────────
      - name: Install APK
        run: |
          echo "Installing APK into emulator..."

          adb install -r build/app/outputs/flutter-apk/app-debug.apk

      # ─────────────────────────────────────────────
      # 9. Run Appium Maven Tests
      # ─────────────────────────────────────────────
      - name: Run Appium Tests
        continue-on-error: true
        run: |
          echo "Running Maven Appium tests..."

          mvn -f test/MobileAutomation/pom.xml test \
            > test_output.txt 2>&1

          echo $? > test_exit_code.txt

          cat test_output.txt

      # ─────────────────────────────────────────────
      # 10. Capture Test Outcome
      # ─────────────────────────────────────────────
      - name: Capture Test Outcome
        id: test_step
        run: |
          EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo "1")

          echo "Maven exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # ─────────────────────────────────────────────
      # 11. Upload Test Logs
      # ─────────────────────────────────────────────
      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-output
          path: test_output.txt
          retention-days: 7

      # ─────────────────────────────────────────────
      # 12. Create Trello Ticket On Failure
      # ─────────────────────────────────────────────
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          echo "Tests failed — creating Trello card..."

          FAILURE_SNIPPET=$(grep -A3 "FAILED\|Error\|Exception\|Tests run" test_output.txt \
            | head -20 | cut -c1-500 || echo "See CI logs for details.")

          DESCRIPTION=$(printf 'Automation tests failed on branch: %s\n\nFailed at: %s\nRun logs: %s\n\n== Failure snippet ==\n%s' \
            "$BRANCH" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "$RUN_URL" \
            "$FAILURE_SNIPPET")

          curl -s -X POST \
            "https://api.trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}" \
            --data-urlencode "idList=${TRELLO_LIST_ID}" \
            --data-urlencode "name=QA Failure: ${BRANCH} [run #${RUN_NUM}]" \
            --data-urlencode "desc=${DESCRIPTION}" \
            --data-urlencode "pos=top"

      # ─────────────────────────────────────────────
      # 13. Create Pull Request On Success
      # ─────────────────────────────────────────────
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          echo "All tests passed — creating PR to main..."

          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH -> main. Skipping."
          else
            PR_BODY=$(printf 'Automated PR after all Appium tests passed on %s.\n\nRun: %s\nTriggered by: @%s' \
              "$BRANCH" "$RUN_URL" "$ACTOR")

            gh pr create \
              --title "Auto-PR: $BRANCH -> main [run #$RUN_NUM]" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
