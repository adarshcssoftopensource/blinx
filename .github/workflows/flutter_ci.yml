name: QA Pipeline (Appium & Trello)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops  # Updated branch name
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      #  Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # Setup Appium Server
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      #  Run Tests
      - name: Run Tests
        id: test_step
        continue-on-error: true
        run: |
          flutter test
          if [ $? -eq 0 ]; then
            echo "outcome=success" >> $GITHUB_OUTPUT
          else
            echo "outcome=failure" >> $GITHUB_OUTPUT
          fi

      # Create Trello Card on Failure
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
        run: |
          echo "Test failed. Sending to Trello..."
          curl --request POST \
            --url "https://api.trello.com/1/cards" \
            --query "key=$TRELLO_KEY" \
            --query "token=$TRELLO_TOKEN" \
            --data-urlencode "idList=$TRELLO_LIST_ID" \
            --data-urlencode "name= Appium Failure: ${{ github.ref_name }}" \
            --data-urlencode "desc=Automation tests failed on branch ${{ github.ref_name }}. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "pos=top"

      # Create Pull Request on Success
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Test passed. Creating PR to main..."
          gh pr create \
            --title "Auto-PR: ${{ github.ref_name }} Passed QA" \
            --body "Automated PR created by GitHub Actions after successful Appium test execution." \
            --base main \
            --head ${{ github.ref_name }}
