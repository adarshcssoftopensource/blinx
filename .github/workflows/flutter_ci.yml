name: QA Pipeline (Appium & Trello)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      #  Setup Environment for Appium (Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Dependencies
        run: |
          npm install -g appium
          # Install any drivers you need (e.g., uiautomator2 for Android)
          appium driver install uiautomator2
          npm install

      # Run Appium Tests
      - name: Run Tests
        id: test_step
        continue-on-error: true
        run: |
          # Replace 'npm test' with your actual test command (e.g., pytest or mocha)
          npm test
          if [ $? -eq 0 ]; then
            echo "outcome=success" >> $GITHUB_OUTPUT
          else
            echo "outcome=failure" >> $GITHUB_OUTPUT
          fi

      #  Create Trello Card on Failure
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
        run: |
          echo "Test failed. Sending to Trello..."
          curl --request POST \
            --url "https://api.trello.com/1/cards" \
            --query "key=$TRELLO_KEY" \
            --query "token=$TRELLO_TOKEN" \
            --data-urlencode "idList=$TRELLO_LIST_ID" \
            --data-urlencode "name= Appium Failure: ${{ github.ref_name }}" \
            --data-urlencode "desc=Mobile automation tests failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "pos=top"

      # Create Pull Request on Success
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Test passed. Creating PR..."
          gh pr create \
            --title "Auto-PR: ${{ github.ref_name }} Passed QA" \
            --body "Automated PR created by GitHub Actions after successful Appium test execution." \
            --base main \
            --head ${{ github.ref_name }}
