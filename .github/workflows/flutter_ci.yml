name: QA Pipeline (Trello & PR)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        id: test_step
        continue-on-error: true
        run: |
          flutter test
          # Store the exit code (0 for success, 1+ for failure)
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      #  STEP: Create Trello Card if Tests Failed
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.exit_code != '0'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
        run: |
          echo "Tests failed. Posting to Trello..."
          curl --request POST \
            --url "https://api.trello.com/1/cards" \
            --header 'Accept: application/json' \
            --query "key=$TRELLO_KEY" \
            --query "token=$TRELLO_TOKEN" \
            --data-urlencode "idList=$TRELLO_LIST_ID" \
            --data-urlencode "name=Test Failure: ${{ github.ref_name }}" \
            --data-urlencode "desc=Pipeline failed for branch ${{ github.ref_name }}. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "pos=top"

      #  STEP: Create PR to Main if Tests Passed
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Tests passed. Opening Pull Request..."
          gh pr create \
            --title "Auto-PR: ${{ github.ref_name }} passed QA" \
            --body "Automated PR generated because flutter tests passed successfully on branch ${{ github.ref_name }}." \
            --base main \
            --head ${{ github.ref_name }}
