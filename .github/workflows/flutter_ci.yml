name: Test Trello Logic Directly

on:
  workflow_dispatch: # This lets you click a "Run" button in GitHub

jobs:
  test_trello:
    runs-on: ubuntu-latest
    steps:
      - name: Force a Failure
        id: test_step
        run: |
          echo "Simulating a failed test..."
          echo "outcome=failure" >> $GITHUB_OUTPUT

      - name: Create Trello Ticket
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
        run: |
          curl --request POST \
            --url "https://api.trello.com/1/cards" \
            --query "key=$TRELLO_KEY" \
            --query "token=$TRELLO_TOKEN" \
            --data-urlencode "idList=$TRELLO_LIST_ID" \
            --data-urlencode "name=🧪 TEST: Manual Trigger" \
            --data-urlencode "desc=This is a test of the GitHub Action logic."
