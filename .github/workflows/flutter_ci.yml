name: QA Pipeline (Appium & Trello)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Java setup (CRITICAL: Must be before Flutter Build) ────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Flutter setup + build debug APK ────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      # ── 4. Node + Appium setup ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # ── 5. Android SDK ─────────────────────────────────────────────────────
      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Run Appium tests inside Android emulator ────────────────────────
      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 33
          arch: x86_64
          profile: pixel
          script: |
            echo "Installing Blinx APK on emulator..."
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            echo "Starting Appium server..."
            appium --address 127.0.0.1 --port 4723 --base-path /wd/hub &
            sleep 15

            echo "Running Maven tests from test/MobileAutomation..."
            cd test/MobileAutomation
            set +e
            mvn test 2>&1 | tee ../../test_output.txt
            echo ${PIPESTATUS[0]} > ../../test_exit_code.txt
            set -e

      # ── 7. Capture test result ─────────────────────────────────────────────
      - name: Capture Test Outcome
        id: test_step
        run: |
          EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo "1")
          echo "Maven exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # ── 8. Upload test output ──────────────────────────────────────────────
      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-output
          path: test_output.txt
          retention-days: 7

      # ── 9. Create Trello Card on Failure ───────────────────────────────────
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          echo "Tests failed — creating Trello card..."

          FAILURE_SNIPPET=$(grep -A3 "FAILED\|Error\|Exception\|Tests run" test_output.txt \
            | head -20 | cut -c1-500 || echo "See CI logs for details.")

          DESCRIPTION=$(printf 'Automation tests failed on branch: %s\n\nFailed at: %s\nRun logs: %s\n\n== Failure snippet ==\n%s' \
            "$BRANCH" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "$RUN_URL" \
            "$FAILURE_SNIPPET")

          curl -s -X POST \
            "https://api.trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}" \
            --data-urlencode "idList=${TRELLO_LIST_ID}" \
            --data-urlencode "name=QA Failure: ${BRANCH} [run #${RUN_NUM}]" \
            --data-urlencode "desc=${DESCRIPTION}" \
            --data-urlencode "pos=top"

      # ── 10. Create Pull Request on Success ────────────────────────────────
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          echo "All tests passed — creating PR to main..."

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists. Skipping creation."
          else
            PR_BODY=$(printf 'Automated PR after all Appium tests passed on %s.\n\nRun: %s\nTriggered by: @%s' \
              "$BRANCH" "$RUN_URL" "$ACTOR")

            gh pr create \
              --title "Auto-PR: ${BRANCH} passed QA [run #${RUN_NUM}]" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
