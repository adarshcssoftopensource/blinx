name: QA Pipeline (Self-Hosted Appium + Trello)

on:
  workflow_dispatch:

  push:
    branches:
      - feature/ci-blinxapp
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 60

    env:
      ANDROID_HOME: /home/azureuser/android-sdk
      FLUTTER_HOME: /home/azureuser/flutter
      PATH: /home/azureuser/flutter/bin:/home/azureuser/android-sdk/platform-tools:/home/azureuser/android-sdk/emulator:/home/azureuser/android-sdk/cmdline-tools/latest/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:

      # ------------------------------------------------
      # 1. Checkout Repository
      # ------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. Verify Installed Dependencies
      # ------------------------------------------------
      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Verify Node.js
        run: node -v

      - name: Verify Flutter
        run: flutter --version

      - name: Verify Appium
        run: appium -v

      # ------------------------------------------------
      # 3. Restart ADB
      # ------------------------------------------------
      - name: Restart ADB
        run: |
          adb kill-server || true
          adb start-server

      # ------------------------------------------------
      # 4. Verify Emulator
      # ------------------------------------------------
      - name: Verify Emulator
        run: |
          echo "Connected devices:"
          adb devices

          echo "Waiting for emulator..."
          adb wait-for-device

          echo "Waiting for Android boot completion..."

          until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
            echo "Android still booting..."
            sleep 5
          done

          echo "Android emulator fully booted"

      # ------------------------------------------------
      # 5. Verify Appium Server
      # ------------------------------------------------
      - name: Verify Appium Server
        run: |
          curl --fail --retry 5 --retry-delay 5 \
          http://127.0.0.1:4723/wd/hub/status

      # ------------------------------------------------
      # 6. Install Flutter Dependencies
      # ------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # ------------------------------------------------
      # 7. Build APK
      # ------------------------------------------------
      - name: Build APK
        run: flutter build apk --debug

      # ------------------------------------------------
      # 8. Upload APK Artifact
      # ------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # ------------------------------------------------
      # 9. Install APK Into Emulator
      # ------------------------------------------------
      - name: Install APK
        run: |
          adb install -r build/app/outputs/flutter-apk/app-debug.apk

      # ------------------------------------------------
      # 10. Run Appium Tests
      # ------------------------------------------------
      - name: Run Appium Tests
        continue-on-error: true
        run: |
          echo "Running Appium Maven tests..."

          mvn -f tests/MobileAutomation/pom.xml test \
          > test_output.txt 2>&1

          echo $? > test_exit_code.txt

          cat test_output.txt

      # ------------------------------------------------
      # 11. Capture Test Result
      # ------------------------------------------------
      - name: Capture Test Outcome
        id: test_step
        run: |
          EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo "1")

          echo "Maven exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------
      # 12. Upload Test Logs
      # ------------------------------------------------
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-output
          path: test_output.txt
          retention-days: 7

      # ------------------------------------------------
      # 13. Create Trello Card On Failure
      # ------------------------------------------------
      - name: Create Trello Card
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          FAILURE_SNIPPET=$(grep -A3 "FAILED\|Error\|Exception\|Tests run" test_output.txt \
            | head -20 | cut -c1-500 || echo "See CI logs for details.")

          DESCRIPTION=$(printf 'Automation tests failed on branch: %s\n\nRun URL: %s\n\nFailure Snippet:\n%s' \
            "$BRANCH" \
            "$RUN_URL" \
            "$FAILURE_SNIPPET")

          curl -s -X POST \
            "https://api.trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}" \
            --data-urlencode "idList=${TRELLO_LIST_ID}" \
            --data-urlencode "name=QA Failure: ${BRANCH} [Run #${RUN_NUM}]" \
            --data-urlencode "desc=${DESCRIPTION}"

      # ------------------------------------------------
      # 14. Create Pull Request On Success
      # ------------------------------------------------
      - name: Create Pull Request
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR already exists"
          else
            PR_BODY=$(printf 'Automated PR after Appium tests passed.\n\nRun URL: %s\nTriggered by: @%s' \
              "$RUN_URL" "$ACTOR")

            gh pr create \
              --title "Auto PR: $BRANCH -> main [Run #$RUN_NUM]" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
