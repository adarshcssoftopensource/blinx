name: QA Pipeline (Appium & Trello)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Java Setup (Must be before Flutter build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Flutter setup + build APK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      # 3. Node + Appium setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # 4. Run Tests in Emulator
      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 29
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # Use bash to support PIPESTATUS
            /bin/bash << 'EOF'
            echo "Waiting for device..."
            adb wait-for-device
            
            echo "Installing APK..."
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            echo "Starting Appium Server..."
            appium --address 127.0.0.1 --port 4723 --base-path /wd/hub &
            sleep 25

            echo "Navigating to: test/MobileAutomation"
            cd test/MobileAutomation
            
            echo "Executing Maven Tests..."
            mvn test 2>&1 | tee ../../test_output.txt
            
            # Capture the exit code of 'mvn test' specifically
            echo "${PIPESTATUS[0]}" > ../../test_exit_code.txt
            EOF

      # 5. Capture Outcome
      - name: Capture Test Outcome
        id: test_step
        run: |
          EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo "1")
          echo "Maven Exit Code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # 6. Upload Logs
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-output
          path: test_output.txt

      # 7. Trello on Failure
      - name: Trello Ticket
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FAILURE_SNIPPET=$(grep -A5 "FAILED\|Error" test_output.txt | head -15 || echo "Check logs.")
          curl -s -X POST "https://api.trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}" \
            --data-urlencode "idList=${TRELLO_LIST_ID}" \
            --data-urlencode "name=❌ QA Failure: ${{ github.ref_name }}" \
            --data-urlencode "desc=Run: ${RUN_URL} Log: ${FAILURE_SNIPPET}"

      # 8. PR on Success
      - name: Create PR
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --title "Auto-PR: ${{ github.ref_name }} passed QA" \
              --body "Automated PR created after successful Appium tests." \
              --base main --head "${{ github.ref_name }}"
          fi
