name: QA Pipeline (Appium & Trello)

on:
  workflow_dispatch:
  push:
    branches:
      - appium-devops
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Added a timeout to prevent the job from hanging indefinitely during boot
    timeout-minutes: 30 

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Java setup (Critical for MapLibre & Gradle) ───────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Flutter setup + build debug APK ────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      # ── 4. Node + Appium setup ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # ── 5. Run Appium tests inside Android emulator ────────────────────────
      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 29 # More stable for CI than API 33
          arch: x86_64
          profile: pixel
          disable-animations: true
          # Optimized emulator flags for headless CI performance
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "Checking device status..."
            adb wait-for-device
            
            echo "Installing Blinx APK on emulator..."
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            echo "Starting Appium server..."
            appium --address 127.0.0.1 --port 4723 --base-path /wd/hub &
            sleep 20 # Increased sleep for runner stability

            echo "Running Maven tests..."
            cd test/MobileAutomation
            set +e
            mvn test 2>&1 | tee ../../test_output.txt
            echo ${PIPESTATUS[0]} > ../../test_exit_code.txt
            set -e

      # ── 6. Capture test result ─────────────────────────────────────────────
      - name: Capture Test Outcome
        id: test_step
        run: |
          # Default to failure (1) if the file is missing
          EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo "1")
          echo "Final exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # ── 7. Upload test output (Artifact) ──────────────────────────────────
      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-output
          path: test_output.txt
          retention-days: 7

      # ── 8. Create Trello Card on Failure ───────────────────────────────────
      - name: Create Trello Ticket on Failure
        if: steps.test_step.outputs.outcome == 'failure'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Tests failed — creating Trello card..."
          
          # Extract a snippet of the failure from the log
          FAILURE_SNIPPET=$(grep -A5 "FAILED\|Error\|Exception" test_output.txt | head -15 || echo "Check CI logs.")

          curl -s -X POST \
            "https://api.trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}" \
            --data-urlencode "idList=${TRELLO_LIST_ID}" \
            --data-urlencode "name=❌ QA Failure: ${BRANCH}" \
            --data-urlencode "desc=Build: ${RUN_URL}  Snippet: ${FAILURE_SNIPPET}" \
            --data-urlencode "pos=top"

      # ── 9. Create Pull Request on Success ────────────────────────────────
      - name: Create Pull Request on Success
        if: steps.test_step.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "All tests passed — checking for existing PR..."
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "Auto-PR: ${BRANCH} passed QA" \
              --body "Automated PR created after successful Appium tests." \
              --base main \
              --head "$BRANCH"
          else
            echo "PR already exists. Nothing to do."
          fi
