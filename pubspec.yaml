name: blinx_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
#  maplibre_gl:
  #    git:
  #      url: https://github.com/maplibre/flutter-maplibre-gl.git
  #      path: maplibre_gl
  #  maplibre_gl: ^0.18.0
  #  intl: any
  audioplayers: ^6.0.0

  shimmer: ^3.0.0
  intl: ^0.19.0
  cached_network_image: ^3.4.0
  dotted_border: ^2.1.0
  video_compress: ^3.1.4
  cupertino_icons: ^1.0.8
  image_picker: ^0.8.7+5
  video_player: ^2.6.0
  carousel_slider: ^5.1.1
  font_awesome_flutter: ^10.12.0
  get: ^4.7.3
  dio: ^5.9.0
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  #  firebase_core: ^4.4.0
  #  firebase_auth: ^6.1.4
  #  firebase_messaging: ^16.1.1
  #  google_sign_in: ^7.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5
  flutter_svg: ^2.2.4
  geolocator: 12.0.0
  geocoding: ^4.0.0
  flutter_blue_plus: ^1.31.15
  permission_handler: ^11.3.1
  uuid: ^4.5.3
  app_links: ^6.3.2
  android_intent_plus: ^5.0.0
  maplibre_gl: 0.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/map/blinx_map_style.json
    - assets/sounds/splash_sound.mp3

  fonts:
    - family: Inter-Bold
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf

    - family: Inter-Italic
      fonts:
        - asset: assets/fonts/Inter-Italic.ttf

    - family: Inter-Light
      fonts:
        - asset: assets/fonts/Inter-Light.ttf

    - family: Inter-Medium
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf

    - family: Inter-Regular
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

    - family: Inter-SemiBold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.ttf

    - family: Inter-Thin
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf

flutter_icons:
  android: false
  ios: false